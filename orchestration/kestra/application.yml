datasources:
  postgres:
    url: jdbc:postgresql://kestra-postgres:5432/kestra
    driver-class-name: org.postgresql.Driver
    username: kestra
    password: ${KESTRA_POSTGRES_PASSWORD}

kestra:
  tutorialFlows:
    enabled: false
  plugins:
    configurations:
      - type: io.kestra.plugin.scripts.runner.docker.Docker
        values:
          volume-enabled: true
  server:
    basic-auth:
      enabled: true
      username: ${KESTRA_ADMIN_EMAIL}
      password: ${KESTRA_ADMIN_PASSWORD}
  repository:
    type: postgres
  queue:
    type: postgres
  storage:
    type: local
    local:
      base-path: /app/storage
  tasks:
    tmp-dir:
      path: /tmp/kestra-wd/tmp
  url: http://localhost:8080/

micronaut:
  io:
    watch:
      enabled: true
      paths:
        - /app/flows
