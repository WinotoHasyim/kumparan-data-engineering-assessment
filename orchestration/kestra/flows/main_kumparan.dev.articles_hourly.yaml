id: articles_hourly
namespace: kumparan.dev

description: Process one completed UTC hour after a one-hour source grace period.

concurrency:
  limit: 1

tasks:
  - id: ingest_window
    type: io.kestra.plugin.core.flow.Subflow
    namespace: kumparan.dev
    flowId: articles_window_ingest
    wait: true
    transmitFailed: true
    restartBehavior: RETRY_FAILED
    inputs:
      window_start: >-
        {{ trigger.date | dateAdd(-2, 'HOURS') | date("yyyy-MM-dd'T'HH:mm:ssXXX", timeZone="UTC") }}
      window_end: >-
        {{ trigger.date | dateAdd(-1, 'HOURS') | date("yyyy-MM-dd'T'HH:mm:ssXXX", timeZone="UTC") }}
      execution_type: SCHEDULED

  - id: transform
    type: io.kestra.plugin.core.flow.Subflow
    namespace: kumparan.dev
    flowId: articles_transform
    wait: true
    transmitFailed: true
    restartBehavior: RETRY_FAILED

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    timezone: UTC
    allowConcurrent: false
    recoverMissedSchedules: ALL
