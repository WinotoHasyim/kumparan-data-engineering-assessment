name: kumparan-data-engineering-assessment

services:
  source-postgres:
    image: postgres:17.7-alpine
    container_name: kumparan-source-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-source_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - source-postgres-data:/var/lib/postgresql/data
      - ./demo_source/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  source-tools:
    build:
      context: .
      target: runtime
      args:
        PYTHON_VERSION: "3.13.15"
        UV_VERSION: "0.12.3"
    image: kumparan-data-engineering-assessment:runtime
    environment:
      SOURCE_ADMIN_DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@source-postgres:5432/${POSTGRES_DB:-source_db}
    depends_on:
      source-postgres:
        condition: service_healthy
    profiles:
      - tools

  source-workload:
    build:
      context: .
      target: runtime
      args:
        PYTHON_VERSION: "3.13.15"
        UV_VERSION: "0.12.3"
    image: kumparan-data-engineering-assessment:runtime
    init: true
    command:
      - python
      - -m
      - demo_source.workload
      - --interval-seconds
      - ${WORKLOAD_INTERVAL_SECONDS:-15}
    environment:
      SOURCE_ADMIN_DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@source-postgres:5432/${POSTGRES_DB:-source_db}
    depends_on:
      source-postgres:
        condition: service_healthy
    profiles:
      - live
    restart: unless-stopped

  article-ingestion:
    build:
      context: .
      target: runtime
      args:
        PYTHON_VERSION: "3.13.15"
        UV_VERSION: "0.12.3"
    image: kumparan-data-engineering-assessment:runtime
    environment:
      SOURCE_READER_DATABASE_URL: >-
        postgresql://source_reader:source_reader@source-postgres:5432/${POSTGRES_DB:-source_db}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCS_RAW_BUCKET: ${GCS_RAW_BUCKET:-}
    depends_on:
      source-postgres:
        condition: service_healthy
    profiles:
      - tools

  kestra-postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_POSTGRES_PASSWORD:-kestra-local-only}
    volumes:
      - kestra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U kestra -d kestra
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  kestra:
    image: kestra/kestra:${KESTRA_VERSION:-v1.3.45}
    user: root
    command:
      - server
      - standalone
      - --config
      - /etc/kestra/application.yml
    environment:
      ENV_GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      ENV_GCS_RAW_BUCKET: ${GCS_RAW_BUCKET:-}
      ENV_SOURCE_READER_DATABASE_URL: >-
        postgresql://source_reader:source_reader@source-postgres:5432/${POSTGRES_DB:-source_db}
      ENV_GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH: >-
        ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:-}
      KESTRA_POSTGRES_PASSWORD: ${KESTRA_POSTGRES_PASSWORD:-kestra-local-only}
      KESTRA_ADMIN_EMAIL: ${KESTRA_ADMIN_EMAIL:-admin@localhost.dev}
      KESTRA_ADMIN_PASSWORD: ${KESTRA_ADMIN_PASSWORD:-Admin1234!}
    volumes:
      - kestra-data:/app/storage
      - ./orchestration/kestra/application.yml:/etc/kestra/application.yml:ro
      - ./orchestration/kestra/flows:/app/flows
      - /var/run/docker.sock:/var/run/docker.sock
      - ${KESTRA_TMP_DIR:-/tmp/kumparan-kestra-wd}:/tmp/kestra-wd
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kestra-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:8081/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  pipeline-test:
    build:
      context: .
      target: test
      args:
        PYTHON_VERSION: "3.13.15"
        UV_VERSION: "0.12.3"
    image: kumparan-data-engineering-assessment:test
    environment:
      SOURCE_ADMIN_DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@source-postgres:5432/${POSTGRES_DB:-source_db}
      SOURCE_READER_DATABASE_URL: >-
        postgresql://source_reader:source_reader@source-postgres:5432/${POSTGRES_DB:-source_db}
    depends_on:
      source-postgres:
        condition: service_healthy
    profiles:
      - test

volumes:
  kestra-data:
    name: kumparan-kestra-data
  kestra-postgres-data:
    name: kumparan-kestra-postgres-data
  source-postgres-data:
    name: kumparan-source-postgres-data
